<title>Fuerte al Medio</title>
<style>
:root{--bg:#000;--card:#121214;--bd:#27272a;--mut:#a1a1aa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 66px) 10px 44px}
canvas{border-radius:22px;touch-action:none;border:1px solid var(--bd);display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#0c0c0e;border-radius:26px 26px 0 0;border-top:1px solid var(--bd);padding:0 14px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:14px;transition:transform .28s cubic-bezier(.2,.9,.2,1);will-change:transform;z-index:5}
#grip{height:44px;margin:0 -14px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
#grip i{width:40px;height:5px;border-radius:9px;background:#3f3f46}
.r{display:flex;gap:10px;align-items:center}
button,select{flex:1;min-width:0;height:48px;padding:0 10px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:#fff;font-size:.85rem;font-weight:500;outline:none;transition:transform .12s,background .15s}
button:active{transform:scale(.94)}
button.on,button.pri{background:#fff;color:#000;border-color:#fff;font-weight:600}
button.dg{color:#f87171}
select{flex:1.3;appearance:none;-webkit-appearance:none;text-align:center}
.cols{display:flex;gap:9px;padding:0 12px;height:48px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:99px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;transition:transform .15s}
.dot.on{border-color:#fff;transform:scale(1.25)}
#st{flex:1;text-align:center;font-size:.85rem;font-weight:600;color:var(--mut)}
.cols{flex:1;justify-content:space-around}
.tabs{position:relative;display:flex;gap:0;background:rgba(255,255,255,.05);padding:4px;border-radius:99px;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tab{position:relative;z-index:1;border:0;background:transparent;height:40px;font-size:.82rem;color:rgba(255,255,255,.6);transition:color .2s .1s}
.tab.on{background:transparent;border:0;color:#fff;font-weight:600}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -6px 12px rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.5),0 0 18px rgba(255,255,255,.08);will-change:transform}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,select{gap:7px;white-space:nowrap}
.chip .i{width:22px;height:22px}
.panels{display:grid}
.panel{grid-area:1/1;display:flex;flex-direction:column;gap:14px;visibility:hidden;opacity:0;transform:translateX(14px);transition:opacity .1s,transform .1s,visibility 0s .1s}
.panel.l{transform:translateX(-14px)}
.panel.on{visibility:visible;opacity:1;transform:none;transition:opacity .22s .1s,transform .32s cubic-bezier(.2,.9,.2,1) .1s,visibility 0s 0s}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{flex-direction:column;height:62px;border-radius:18px;gap:2px;font-size:.7rem;padding:0}
.chip b{font-size:1.2rem;font-weight:400;line-height:1.2}
.sl{display:flex;flex-direction:column;gap:6px;font-size:.8rem;color:var(--mut)}
.sl input{width:100%;accent-color:#fff;height:28px}
.dim{opacity:.35}
.hint{font-size:.75rem;color:var(--mut);text-align:center;line-height:1.4}
.foot{border-top:1px solid var(--bd);padding-top:12px}
#hd{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 12px) 18px 0;pointer-events:none}
#hd>*{pointer-events:auto}
#tn{background:transparent;border:0;border-bottom:1px solid transparent;border-radius:0;color:#fff;font-size:1.05rem;font-weight:600;width:11.5rem;max-width:55vw;outline:none;padding:0 0 2px;user-select:text;-webkit-user-select:text}
#tn:focus{border-bottom-color:var(--mut)}
#fl{font-size:.78rem;color:var(--mut);margin-top:2px}
.brand{text-align:right;line-height:1.2}
.brand b{display:block;font-size:.92rem;letter-spacing:.14em;font-weight:800}
.brand span{font-size:.7rem;color:var(--mut);letter-spacing:.06em}
#modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:10}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;width:84%;max-width:300px;display:flex;flex-direction:column;gap:10px}
.mc input{height:42px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:#fff;text-align:center;font-size:1rem;outline:none;user-select:text;-webkit-user-select:text}
.mc input[type=color]{padding:3px 8px;width:100%}
</style>
</head>
<body>

<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>

<symbol id="film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/></symbol>
<symbol id="chl" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
<symbol id="chr" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
<symbol id="dotB" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/></symbol>
<symbol id="dotR" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#ef4444" stroke="#fff" stroke-width="1.5"/></symbol>
</defs></svg>
<div id="hd">
  <div>
    <input id="tn" value="Mi táctica" maxlength="30" placeholder="Nombre de la táctica" aria-label="Nombre de la táctica">
    <div id="fl">Formación 4-3-3</div>
  </div>
  <div class="brand"><b>FUERTE AL MEDIO</b><span>pizarra táctica</span></div>
</div>
<div id="stage"><canvas id="board"></canvas></div>

<div id="sheet">
  <div id="grip"><i></i></div>
  <div class="tabs">
    <div class="pill" id="pill"></div>
    <button class="tab on" data-t="draw"><svg class="i"><use href="#pencil"/></svg>Dibujo</button>
    <button class="tab" data-t="players"><svg class="i"><use href="#users"/></svg>Jugadores</button>
    <button class="tab" data-t="steps"><svg class="i"><use href="#film"/></svg>Pasos</button>
  </div>
  <div class="panels">
    <div class="panel on" id="p-draw">
      <div class="chips">
        <button class="chip on" data-k="brush"><svg class="i"><use href="#pencil"/></svg>Pincel</button>
        <button class="chip" data-k="line"><svg class="i"><use href="#line"/></svg>Línea</button>
        <button class="chip" data-k="rect"><svg class="i"><use href="#rect"/></svg>Rect.</button>
        <button class="chip" data-k="oval"><svg class="i"><use href="#circle"/></svg>Círculo</button>
        <button class="chip" data-k="erase"><svg class="i"><use href="#eraser"/></svg>Borrar</button>
      </div>
      <div class="r">
        <button id="tA" class="on"><svg class="i"><use href="#arrow"/></svg>Flecha</button>
        <button id="tF"><svg class="i"><use href="#fill"/></svg>Relleno</button>
        <button id="bU"><svg class="i"><use href="#undo"/></svg>Deshacer</button>
      </div>
      <div class="sl"><label id="szL">Grosor del trazo</label><input id="sz" type="range" min="1" max="100" value="30"></div>
      <div class="r"><div class="cols" id="cols"></div><button id="cl" style="flex:.8"><svg class="i"><use href="#trash"/></svg>Limpiar</button></div>
    </div>
    <div class="panel" id="p-players">
      <div class="r"><select id="fm"></select></div>
      <div class="r">
        <button id="aB"><svg class="i"><use href="#dotB"/></svg>Azul</button>
        <button id="aR"><svg class="i"><use href="#dotR"/></svg>Rojo</button>
        <button id="aBall"><svg class="i"><use href="#ball"/></svg>Pelota</button>
      </div>
      <div class="r"><button id="dM"><svg class="i"><use href="#trash"/></svg>Modo eliminar (toca una ficha)</button></div>
      <p class="hint">Doble toque en un jugador: editar número y color.<br>Arrastra una ficha fuera de la cancha para eliminarla.</p>
    </div>

      </div>

        <button id="sv" class="pri"><svg class="i"><use href="#plus"/></svg>Paso nuevo</button>
        <button id="up"><svg class="i"><use href="#refresh"/></svg>Actualizar</button>

</div>

<div id="modal"><div class="mc">
  <h4 style="text-align:center;font-weight:500">Editar jugador</h4>
  <input id="mN" placeholder="Número" maxlength="3">
  <input id="mC" type="color">
  <div class="r"><button id="mS" class="pri">Guardar</button><button id="mD" class="dg">Eliminar</button></div>
  <button id="mX">Cerrar</button>
</div></div>

<script>
window.onerror=function(m,u,l){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#7f1d1d;color:#fff;font:12px monospace;padding:8px';d.textContent='Error: '+m+' (línea '+l+')';document.body.appendChild(d)};

(()=>{
const q=s=>document.querySelector(s);
const ico=n=>'<svg class="i"><use href="#'+n+'"/></svg>';
const setPl=o=>{q('#pl').innerHTML=ico(o?'pause':'play')+(o?'Detener':'Reproducir')};
const cv=q('#board'),ctx=cv.getContext('2d'),pitch=document.createElement('canvas'),stage=q('#stage'),sheet=q('#sheet'),grip=q('#grip');
const BLUE='#3b82f6',RED='#ef4444',COLORS=['#ffffff','#facc15','#ef4444','#3b82f6'];
const FORM={'4-3-3':[4,3,3],'4-2-1-3':[4,2,1,3],'4-2-3-1':[4,2,3,1],'4-4-2 Plano':[4,4,2],'4-4-2 Rombo':[4,1,2,1,2],'3-5-2':[3,5,2],'5-3-2':[5,3,2],'4-1-4-1':[4,1,4,1]};
let W=0,H=0,dpr=1,raf=0,uid=1;
let ents=[],strokes=[],steps=[],cur=0,tool='brush',color='#ffffff';
const layer=document.createElement('canvas'),lc=layer.getContext('2d');
let tab='draw',arrow=true,fill=false,bV=30,eV=35,delMode=false,cursor=null,prevT=0;
const bw=()=>.004+bV/100*.03,ew=()=>.03+eV/100*.17;
let anim=null,drag=null,live=null,erasing=false,editing=null,last={t:0,e:null},playT=0;

/* ---------- Formaciones ---------- */
function layout(k){
  const L=FORM[k],n=L.length,out=[[.5,.93]];
  L.forEach((c,i)=>{const y=.80-i*(.27/(n-1));for(let j=0;j<c;j++)out.push([(j+1)/(c+1),y])});
  return out;
}
const mk=(x,y,n,c,ball)=>({id:uid++,x,y,sx:x,sy:y,tx:x,ty:y,n:String(n),c,ball:!!ball});
function setFormation(k){
  q('#fl').textContent='Formación '+k;
  const pos=layout(k),pl=ents.filter(e=>!e.ball);
  pos.forEach((p,i)=>{
    let e=pl[i];
    if(!e){e=mk(p[0],p[1],i+1,BLUE);ents.push(e)}
    e.sx=e.x;e.sy=e.y;e.tx=p[0];e.ty=p[1];e.n=String(i+1);
  });
  startAnim(450);
}
function init(){
  uid=1;ents=[];strokes=[];steps=[];cur=0;rebuildLayer();
  q('#fl').textContent='Formación '+q('#fm').value;
  layout(q('#fm').value).forEach((p,i)=>ents.push(mk(p[0],p[1],i+1,BLUE)));
  ents.push(mk(.5,.5,'',  '#fff',true));
  steps=[snap()];updateUI();req();
}

/* ---------- Pasos / animación ---------- */
const snap=()=>({e:ents.map(e=>({id:e.id,x:(e.tx!=null?e.tx:e.x),y:(e.ty!=null?e.ty:e.y),n:e.n,c:e.c,ball:e.ball})),s:JSON.parse(JSON.stringify(strokes))});
function load(i){
  cur=i;const S=steps[i],old=new Map(ents.map(e=>[e.id,e]));
  ents=S.e.map(s=>{
    const o=old.get(s.id),e=o||mk(s.x,s.y,s.n,s.c,s.ball);
    e.id=s.id;e.sx=o?o.x:s.x;e.sy=o?o.y:s.y;e.tx=s.x;e.ty=s.y;e.n=s.n;e.c=s.c;e.ball=s.ball;return e;
  });
  uid=Math.max(uid,...ents.map(e=>e.id+1));
  strokes=JSON.parse(JSON.stringify(S.s));rebuildLayer();
  startAnim(550);updateUI();
}
function startAnim(d){anim={t0:performance.now(),d};req()}
function updateUI(){q('#st').textContent='Paso '+(cur+1)+'/'+steps.length}
const stopPlay=()=>{clearTimeout(playT);playT=0;setPl(false)};
function play(){
  if(playT){stopPlay();return}
  setPl(true);
  let i=cur>=steps.length-1?0:cur;
  const go=()=>{load(i);if(++i<steps.length)playT=setTimeout(go,850);else playT=setTimeout(stopPlay,850)};
  go();
}

/* ---------- Dibujo ---------- */
function buildPitch(){
  pitch.width=W*dpr;pitch.height=H*dpr;
  const p=pitch.getContext('2d');p.setTransform(dpr,0,0,dpr,0,0);
  p.fillStyle='#14391f';p.fillRect(0,0,W,H);
  const m=W*.05,fw=W-2*m,fh=H-2*m,bands=10;
  p.fillStyle='rgba(255,255,255,.025)';
  for(let i=0;i<bands;i+=2)p.fillRect(m,m+i*fh/bands,fw,fh/bands);
  p.strokeStyle='rgba(255,255,255,.7)';p.fillStyle='rgba(255,255,255,.8)';p.lineWidth=Math.max(1.5,W*.005);
  p.strokeRect(m,m,fw,fh);
  const cx=W/2,cy=H/2;
  p.beginPath();p.moveTo(m,cy);p.lineTo(W-m,cy);p.stroke();
  p.beginPath();p.arc(cx,cy,fw*.135,0,7);p.stroke();
  p.beginPath();p.arc(cx,cy,W*.008,0,7);p.fill();
  const aw=fw*.593,ah=fh*.157,gw=fw*.269,gh=fh*.052,pd=fh*.105,ar=fw*.135,ang=.927;
  [[1,0],[-1,1]].forEach(([d,top])=>{
    const y0=top?m:H-m,s=top?1:-1; // s: hacia el centro del campo
    p.strokeRect(cx-aw/2,top?m:H-m-ah,aw,ah);
    p.strokeRect(cx-gw/2,top?m:H-m-gh,gw,gh);
    const py=y0+s*pd;
    p.beginPath();p.arc(cx,py,W*.008,0,7);p.fill();
    p.beginPath();const c=top?Math.PI/2:-Math.PI/2;p.arc(cx,py,ar,c-ang,c+ang);p.stroke();
  });
}
function rebuildLayer(){lc.clearRect(0,0,W,H);strokes.forEach(s=>drawStroke(lc,s))}
function drawStroke(c,s){
  const P=s.p,X=i=>P[i][0]*W,Y=i=>P[i][1]*H,er=s.k==='erase';
  c.lineCap=c.lineJoin='round';c.lineWidth=s.w*W;
  if(er){c.globalCompositeOperation='destination-out';c.strokeStyle='#000'}else c.strokeStyle=c.fillStyle=s.c;
  c.beginPath();
  if(s.k==='rect'||s.k==='oval'){
    const x0=X(0),y0=Y(0),x1=X(1),y1=Y(1);
    if(s.k==='rect')c.rect(x0,y0,x1-x0,y1-y0);else c.ellipse((x0+x1)/2,(y0+y1)/2,Math.abs(x1-x0)/2,Math.abs(y1-y0)/2,0,0,7);
    if(s.f){c.globalAlpha=.3;c.fill();c.globalAlpha=1}
    c.stroke();
  }else{
    c.moveTo(X(0),Y(0));
    if(P.length===1)c.lineTo(X(0)+.01,Y(0));
    for(let i=1;i<P.length;i++)c.lineTo(X(i),Y(i));
    c.stroke();
    const n=P.length-1;
    if(s.a&&!er&&n>0&&Math.hypot(X(n)-X(0),Y(n)-Y(0))>W*.1){
      const q=Math.max(0,n-6),a=Math.atan2(Y(n)-Y(q),X(n)-X(q)),z=Math.max(W*.03,s.w*W*3),x=X(n),y=Y(n);
      c.beginPath();c.moveTo(x+Math.cos(a)*z*.4,y+Math.sin(a)*z*.4);
      c.lineTo(x+Math.cos(a+2.5)*z,y+Math.sin(a+2.5)*z);c.lineTo(x+Math.cos(a-2.5)*z,y+Math.sin(a-2.5)*z);c.fill();
    }
  }
  c.globalCompositeOperation='source-over';
}
function drawEnt(e){
  const x=e.x*W,y=e.y*H,r=W*(e.ball?.026:.04);
  ctx.beginPath();ctx.arc(x,y,r,0,7);
  if(e.ball){
    ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(x,y,r*.42,0,7);ctx.fillStyle='#111';ctx.fill();return;
  }
  ctx.fillStyle=e.c;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.5,W*.005);ctx.stroke();
  ctx.fillStyle='#fff';ctx.font='700 '+(r*.9)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(e.n,x,y+r*.04);
}
function frame(now){
  raf=0;
  if(anim){
    const p=Math.min(1,(now-anim.t0)/anim.d),k=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    for(const e of ents){e.x=e.sx+(e.tx-e.sx)*k;e.y=e.sy+(e.ty-e.sy)*k}
    if(p>=1)anim=null;
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(pitch,0,0,W,H);
  ctx.drawImage(layer,0,0,W,H);
  if(live&&live.k!=='erase')drawStroke(ctx,live);
  ents.forEach(drawEnt);
  const pv=performance.now()<prevT,cu=cursor||(pv?[.5,.5]:null);
  if(cu&&tab==='draw'){
    ctx.beginPath();
    if(tool==='erase'){ctx.arc(cu[0]*W,cu[1]*H,ew()*W/2,0,7);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
    else if(pv){ctx.arc(cu[0]*W,cu[1]*H,bw()*W/2,0,7);ctx.fillStyle=color;ctx.fill()}
  }
  if(anim)req();
}
function req(){if(!raf)raf=requestAnimationFrame(frame)}

/* ---------- Tamaño ---------- */
function resize(){
  const cw=stage.clientWidth-20,ch=stage.clientHeight-parseFloat(getComputedStyle(stage).paddingTop)-parseFloat(getComputedStyle(stage).paddingBottom);
  const ratio=.66;let w=cw,h=w/ratio;if(h>ch){h=ch;w=h*ratio}
  if(w<50||h<50)return;
  const nw=Math.floor(w),nh=Math.floor(h),nd=Math.min(window.devicePixelRatio||1,2);
  if(nw===W&&nh===H&&nd===dpr)return;
  W=nw;H=nh;dpr=nd;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  layer.width=W*dpr;layer.height=H*dpr;lc.setTransform(dpr,0,0,dpr,0,0);
  buildPitch();rebuildLayer();frame(performance.now());
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);

/* ---------- Punteros ---------- */
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]}
function hit(x,y){
  for(let i=ents.length-1;i>=0;i--){const e=ents[i];
    if(Math.hypot((e.x-x)*W,(e.y-y)*H)<=W*(e.ball?.05:.062))return e}
  return null;
}
cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId);stopPlay();
  const[x,y]=pos(ev),dr=tab==='draw',er=dr&&tool==='erase',e=er?null:hit(x,y);
  if(e){
    if(delMode){ents=ents.filter(o=>o!==e);req();return}
    if(e===last.e&&ev.timeStamp-last.t<320&&!e.ball){drag=null;openModal(e);last={t:0,e:null};return}
    last={t:ev.timeStamp,e};anim=null;drag={e,dx:e.x-x,dy:e.y-y};
    if(navigator.vibrate)navigator.vibrate(6);
  }else if(dr){
    const sh=tool==='rect'||tool==='oval'||tool==='line';
    live={k:tool,c:color,w:er?ew():bw(),a:arrow,f:fill,p:sh?[[x,y],[x,y]]:[[x,y]]};
    if(er){cursor=[x,y];drawStroke(lc,{k:'erase',w:live.w,p:[[x,y]]})}
  }
  req();
});
cv.addEventListener('pointermove',ev=>{
  if(!drag&&!live)return;
  const[x,y]=pos(ev);
  if(drag){const e=drag.e;e.x=e.tx=e.sx=Math.min(1,Math.max(0,x+drag.dx));e.y=e.ty=e.sy=Math.min(1,Math.max(0,y+drag.dy))}
  else{
    const P=live.p,k=live.k;
    if(k==='rect'||k==='oval'||k==='line')P[1]=[x,y];
    else{const l=P[P.length-1];if(Math.hypot((x-l[0])*W,(y-l[1])*H)>2){P.push([x,y]);if(k==='erase')drawStroke(lc,{k:'erase',w:live.w,p:[l,[x,y]]})}}
    if(k==='erase')cursor=[x,y];
  }
  req();
});
const up=()=>{
  if(drag){const e=drag.e;if(e.x<.03||e.x>.97||e.y<.02||e.y>.98)ents=ents.filter(o=>o!==e)}
  if(live){
    const P=live.p,sh=P.length===2&&live.k!=='brush'&&live.k!=='erase';
    if(!(sh&&Math.hypot((P[1][0]-P[0][0])*W,(P[1][1]-P[0][1])*H)<6)){strokes.push(live);if(live.k!=='erase')drawStroke(lc,live)}
  }
  drag=live=cursor=null;req();
};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- Modal ---------- */
function openModal(e){editing=e;q('#mN').value=e.n;q('#mC').value=e.c;q('#modal').style.display='flex'}
const closeModal=()=>{q('#modal').style.display='none';editing=null};
q('#mS').onclick=()=>{if(editing){editing.n=q('#mN').value.slice(0,3);editing.c=q('#mC').value;req()}closeModal()};
q('#mD').onclick=()=>{ents=ents.filter(e=>e!==editing);closeModal();req()};
q('#mX').onclick=closeModal;

/* ---------- Controles ---------- */
const qa=s=>[...document.querySelectorAll(s)];
const TABS=['draw','players','steps'];let tabI=0,pillAnim=null;
function setTab(t,first){
  const ni=TABS.indexOf(t),pill=q('#pill'),from=tabI*100,to=ni*100;
  tab=t;cursor=null;
  if(t!=='players'){delMode=false;q('#dM').classList.remove('on')}
  qa('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  qa('.panel').forEach((p,i)=>{p.classList.toggle('on',i===ni);p.classList.toggle('l',i<ni)});
  pill.style.transform='translateX('+to+'%)';
  if(!first&&ni!==tabI&&pill.animate){
    const n=Math.abs(ni-tabI)+1;
    if(pillAnim)pillAnim.cancel();
    pillAnim=pill.animate([
      {transform:'translateX('+from+'%) scale(1,1)',easing:'cubic-bezier(.4,0,.2,1)'},
      {transform:'translateX('+(from+to)/2+'%) scale('+n+',1.07)',offset:.42,easing:'cubic-bezier(.2,.9,.3,1.12)'},
      {transform:'translateX('+to+'%) scale(1,1)'}
    ],{duration:480});
  }
  tabI=ni;req();
}
qa('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function showPrev(){prevT=performance.now()+900;req();setTimeout(req,950)}
function syncTool(){
  const er=tool==='erase';
  qa('.chip').forEach(b=>b.classList.toggle('on',b.dataset.k===tool));
  q('#tA').classList.toggle('dim',!(tool==='brush'||tool==='line'));
  q('#tF').classList.toggle('dim',!(tool==='rect'||tool==='oval'));
  q('#cols').classList.toggle('dim',er);
  q('#sz').value=er?eV:bV;q('#szL').textContent=er?'Tamaño del borrador':'Grosor del trazo';
  showPrev();
}
qa('.chip').forEach(b=>b.onclick=()=>{tool=b.dataset.k;syncTool()});
q('#sz').oninput=e=>{const v=+e.target.value;if(tool==='erase')eV=v;else bV=v;showPrev()};
q('#tA').onclick=e=>{arrow=!arrow;e.currentTarget.classList.toggle('on',arrow)};
q('#tF').onclick=e=>{fill=!fill;e.currentTarget.classList.toggle('on',fill)};
q('#bU').onclick=()=>{strokes.pop();rebuildLayer();req()};
q('#cl').onclick=()=>{strokes=[];rebuildLayer();req()};
COLORS.forEach((c,i)=>{const d=document.createElement('div');d.className='dot'+(i?'':' on');d.style.background=c;
  d.onclick=()=>{color=c;qa('.dot').forEach(x=>x.classList.remove('on'));d.classList.add('on');if(tool==='erase'){tool='brush';syncTool()}else showPrev()};
  q('#cols').appendChild(d)});
Object.keys(FORM).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent='Formación '+k;q('#fm').appendChild(o)});
q('#fm').onchange=e=>setFormation(e.target.value);
const add=c=>{const n=ents.filter(e=>!e.ball).length+1;ents.push(mk(.5,.5,n,c));req()};
q('#aB').onclick=()=>add(BLUE);q('#aR').onclick=()=>add(RED);
q('#aBall').onclick=()=>{ents=ents.filter(e=>!e.ball);ents.push(mk(.5,.5,'','#fff',true));req()};
q('#dM').onclick=e=>{delMode=!delMode;e.currentTarget.classList.toggle('on',delMode)};
q('#sv').onclick=()=>{steps.splice(cur+1,0,snap());cur++;updateUI()};
q('#up').onclick=()=>{steps[cur]=snap();updateUI()};
q('#ds').onclick=()=>{if(steps.length<2)return;stopPlay();steps.splice(cur,1);load(Math.min(cur,steps.length-1))};
q('#pv').onclick=()=>{stopPlay();if(cur>0)load(cur-1)};
q('#nx').onclick=()=>{stopPlay();if(cur<steps.length-1)load(cur+1)};
q('#pl').onclick=play;
let rt=0;
const rsL=()=>{q('#rs').innerHTML=ico('reset')+'Reiniciar todo'};
q('#rs').onclick=()=>{
  if(rt){clearTimeout(rt);rt=0;rsL();stopPlay();init();return}
  q('#rs').innerHTML='¿Seguro? Toca otra vez';rt=setTimeout(()=>{rt=0;rsL()},2500);
};

/* ---------- Bottom sheet arrastrable (superpone la cancha) ---------- */
let open=true,sy=0,base=0,off=0,t0=0;
const hid=()=>sheet.offsetHeight-44;
function setSheet(y){
  off=Math.min(hid(),Math.max(0,y));open=off<hid()/2;
  sheet.style.transition='';sheet.style.transform='translateY('+off+'px)';
}
grip.addEventListener('pointerdown',e=>{grip.setPointerCapture(e.pointerId);sy=e.clientY;t0=e.timeStamp;base=off;sheet.style.transition='none'});
grip.addEventListener('pointermove',e=>{if(!grip.hasPointerCapture(e.pointerId))return;off=Math.min(hid(),Math.max(0,base+e.clientY-sy));sheet.style.transform='translateY('+off+'px)'});
grip.addEventListener('pointerup',e=>{
  const d=e.clientY-sy,v=d/Math.max(1,e.timeStamp-t0);
  if(Math.abs(d)<6){setSheet(open?hid():0);return}
  let y=off;
  if(v>.6)y=hid();else if(v<-.6)y=0;else if(y<30)y=0;else if(y>hid()-30)y=hid();
  setSheet(y);
});
window.addEventListener('contextmenu',e=>e.preventDefault());

q('#tn').onkeydown=e=>{if(e.key==='Enter')e.target.blur()};
cv.addEventListener('pointerdown',()=>q('#tn').blur());
init();setSheet(0);setTab('draw',true);
})();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
</body>
